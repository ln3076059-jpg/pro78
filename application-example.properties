# ==============================================================================
# HƯỚNG DẪN CẤU HÌNH MẪU - APPLICATION PROPERTIES EXAMPLE
# Sao chép tệp này thành src/main/resources/application.properties hoặc cấu hình biến môi trường
# ==============================================================================
spring.application.name=hospital-drug-association-mining
server.port=8080

# Cấu hình MySQL
spring.datasource.url=jdbc:mysql://localhost:3306/hospital_drug_mining?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&characterEncoding=UTF-8&createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=your_mysql_password_here
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# Multipart File Upload (CSV)
spring.servlet.multipart.max-file-size=500MB
spring.servlet.multipart.max-request-size=500MB

# Đường dẫn bộ dữ liệu UCI Diabetes 130-US Hospitals
dataset.path=dataset/diabetic_data.csv
dataset.sample-path=dataset/diabetic_data_sample.csv
app.upload.dir=uploads

# Hoặc cấu hình Profile H2 (Chạy thử nghiệm không cần cài đặt MySQL):
# spring.profiles.active=h2
