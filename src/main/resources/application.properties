# ==============================================================================
# Bệnh Viện & Khai Phá Dữ Liệu Kết Hợp Thuốc - Application Configuration
# ==============================================================================
spring.application.name=hospital-drug-association-mining
server.port=8080

# ------------------------------------------------------------------------------
# Cấu hình Cơ sở dữ liệu MySQL (Mặc định cho XAMPP / Local MySQL)
# ------------------------------------------------------------------------------
spring.datasource.url=jdbc:mysql://localhost:3306/hospital_drug_mining?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&characterEncoding=UTF-8&createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# ------------------------------------------------------------------------------
# Cấu hình Multipart Upload (Hỗ trợ upload file CSV Dataset)
# ------------------------------------------------------------------------------
spring.servlet.multipart.max-file-size=500MB
spring.servlet.multipart.max-request-size=500MB
spring.servlet.multipart.file-size-threshold=2MB

# ------------------------------------------------------------------------------
# Thymeleaf Configuration
# ------------------------------------------------------------------------------
spring.thymeleaf.cache=false
spring.thymeleaf.mode=HTML
spring.thymeleaf.encoding=UTF-8

# ------------------------------------------------------------------------------
# Cấu hình Bộ dữ liệu Khai phá (UCI Diabetes 130-US Hospitals)
# ------------------------------------------------------------------------------
dataset.path=dataset/diabetic_data.csv
dataset.sample-path=dataset/diabetic_data_sample.csv
dataset.upload-dir=uploads/datasets

# Tương thích đường dẫn cũ nếu có
app.mimic.demo-data-dir=dataset
app.mimic.upload-dir=uploads/datasets

# Cấu hình Khởi tạo Dữ liệu & Tự động chạy Khai phá (Mặc định: false để khởi động nhanh)
app.seed.auto-mining=false

# Logging
logging.level.com.hospital.datamining=INFO
logging.level.org.springframework.security=WARN
