<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng nhập - MediMining Hệ Thống Bệnh Viện</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 50%, #0369a1 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .login-card {
            background: #ffffff;
            border-radius: 1rem;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.25);
            max-width: 440px;
            width: 100%;
            padding: 2.5rem;
        }
        .demo-pill {
            background-color: #f0f9ff;
            border: 1px dashed #38bdf8;
            border-radius: 0.5rem;
            padding: 0.75rem 1rem;
        }
    </style>
</head>
<body>

<div class="login-card">
    <div class="text-center mb-4">
        <div class="d-inline-flex align-items-center justify-content-center bg-primary-subtle text-primary rounded-circle mb-3" style="width: 64px; height: 64px;">
            <i class="fas fa-hospital-alt fs-2"></i>
        </div>
        <h3 class="fw-bold text-dark">MediMining</h3>
        <p class="text-muted small">Khai phá luật kết hợp thuốc điều trị trong hệ thống quản lý bệnh viện</p>
    </div>

    <!-- Thông báo lỗi hoặc đăng xuất -->
    <div th:if="${errorMessage}" class="alert alert-danger alert-dismissible fade show small" role="alert">
        <i class="fas fa-exclamation-circle me-1"></i> <span th:text="${errorMessage}"></span>
    </div>
    <div th:if="${successMessage}" class="alert alert-success alert-dismissible fade show small" role="alert">
        <i class="fas fa-check-circle me-1"></i> <span th:text="${successMessage}"></span>
    </div>

    <form th:action="@{/login}" method="post">
        <div class="mb-3">
            <label class="form-label fw-semibold text-secondary small">Tên đăng nhập</label>
            <div class="input-group">
                <span class="input-group-text bg-light"><i class="fas fa-user text-muted"></i></span>
                <input type="text" name="username" class="form-control" placeholder="Nhập tên đăng nhập" required autofocus>
            </div>
        </div>

        <div class="mb-4">
            <label class="form-label fw-semibold text-secondary small">Mật khẩu</label>
            <div class="input-group">
                <span class="input-group-text bg-light"><i class="fas fa-lock text-muted"></i></span>
                <input type="password" name="password" class="form-control" placeholder="Nhập mật khẩu" required>
            </div>
        </div>

        <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold mb-3">
            <i class="fas fa-sign-in-alt me-1"></i> Đăng nhập hệ thống
        </button>
    </form>

    <!-- Tài khoản demo có sẵn -->
    <div class="demo-pill mt-3">
        <div class="fw-bold text-primary small mb-1"><i class="fas fa-key me-1"></i> Tài khoản Demo:</div>
        <div class="d-flex justify-content-between text-muted small">
            <span><strong>admin</strong> / <code>admin123</code> (Quản trị/Data Mining)</span>
        </div>
        <div class="d-flex justify-content-between text-muted small mt-1">
            <span><strong>doctor</strong> / <code>doctor123</code> (Bác sĩ kê đơn)</span>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
