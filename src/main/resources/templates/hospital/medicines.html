<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head th:replace="~{layout/base :: head('Danh Mục Thuốc Bệnh Viện')}"></head>
<body>

<div class="container-fluid p-0">
    <div class="row g-0">
        <nav th:replace="~{layout/base :: sidebar}"></nav>

        <main class="col-md-9 col-lg-10 ms-sm-auto px-md-4 py-3">
            <div class="d-flex justify-content-between flex-wrap flex-md-nowrap align-items-center pb-2 mb-3 border-bottom">
                <h4 class="h5 text-primary fw-bold mb-0">Danh Mục Thuốc Bệnh Viện (Formulary)</h4>
                <button type="button" class="btn btn-sm btn-primary" data-bs-toggle="modal" data-bs-target="#addMedicineModal">
                    <i class="fas fa-plus me-1"></i> Thêm Thuốc Mới
                </button>
            </div>

            <!-- Flash alerts -->
            <div th:if="${successMessage}" class="alert alert-success alert-dismissible fade show" role="alert">
                <i class="fas fa-check-circle me-1"></i> <span th:text="${successMessage}"></span>
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            </div>

            <div class="card shadow-sm border-0">
                <div class="table-responsive">
                    <table class="table table-hover align-middle mb-0">
                        <thead class="table-light">
                            <tr>
                                <th>#</th>
                                <th>Mã Thuốc</th>
                                <th>Tên Gốc (Generic Name)</th>
                                <th>Biệt Dược (Brand Name)</th>
                                <th>Dạng Bào Chế</th>
                                <th>Hàm Lượng</th>
                                <th>Đường Dùng</th>
                                <th>Tác Dụng Dược Lý</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="m, stat : ${medicines}">
                                <td th:text="${stat.count}">1</td>
                                <td><span class="badge bg-light text-dark border font-monospace" th:text="${m.drugCode}">MED001</span></td>
                                <td><strong class="text-primary" th:text="${m.genericName}">Aspirin</strong></td>
                                <td th:text="${m.brandName}">Aspilets</td>
                                <td th:text="${m.dosageForm}">Viên nén</td>
                                <td th:text="${m.strength}">81mg</td>
                                <td><span class="badge bg-info-subtle text-info" th:text="${m.route}">Uống</span></td>
                                <td class="small text-muted" th:text="${m.description}">Kháng kết tập tiểu cầu</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>

            <!-- Modal Thêm Thuốc -->
            <div class="modal fade" id="addMedicineModal" tabindex="-1">
                <div class="modal-dialog">
                    <div class="modal-content">
                        <form th:action="@{/medicines/save}" method="post">
                            <div class="modal-header">
                                <h5 class="modal-title fw-bold">Thêm Thuốc Vào Danh Mục</h5>
                                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                            </div>
                            <div class="modal-body">
                                <div class="mb-2">
                                    <label class="form-label small fw-semibold">Mã Thuốc:</label>
                                    <input type="text" name="drugCode" class="form-control form-control-sm" placeholder="VD: MED012" required>
                                </div>
                                <div class="mb-2">
                                    <label class="form-label small fw-semibold">Tên Gốc (Generic Name):</label>
                                    <input type="text" name="genericName" class="form-control form-control-sm" placeholder="VD: Clopidogrel" required>
                                </div>
                                <div class="mb-2">
                                    <label class="form-label small fw-semibold">Tên Biệt Dược (Brand Name):</label>
                                    <input type="text" name="brandName" class="form-control form-control-sm" placeholder="VD: Plavix">
                                </div>
                                <div class="row g-2 mb-2">
                                    <div class="col-6">
                                        <label class="form-label small fw-semibold">Dạng Bào Chế:</label>
                                        <input type="text" name="dosageForm" class="form-control form-control-sm" placeholder="Viên nén bao phim">
                                    </div>
                                    <div class="col-6">
                                        <label class="form-label small fw-semibold">Hàm Lượng:</label>
                                        <input type="text" name="strength" class="form-control form-control-sm" placeholder="75mg">
                                    </div>
                                </div>
                                <div class="mb-2">
                                    <label class="form-label small fw-semibold">Đường Dùng:</label>
                                    <input type="text" name="route" class="form-control form-control-sm" placeholder="Uống / Tiêm tĩnh mạch">
                                </div>
                                <div class="mb-2">
                                    <label class="form-label small fw-semibold">Mô Tả / Chỉ Định:</label>
                                    <textarea name="description" class="form-control form-control-sm" rows="2"></textarea>
                                </div>
                            </div>
                            <div class="modal-footer">
                                <button type="button" class="btn btn-sm btn-secondary" data-bs-dismiss="modal">Đóng</button>
                                <button type="submit" class="btn btn-sm btn-primary">Lưu Thuốc</button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </main>
    </div>
</div>

<div th:replace="~{layout/base :: scripts}"></div>
</body>
</html>
