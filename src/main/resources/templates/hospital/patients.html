<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head th:replace="~{layout/base :: head('Quản Lý Bệnh Nhân')}"></head>
<body>

<div class="container-fluid p-0">
    <div class="row g-0">
        <nav th:replace="~{layout/base :: sidebar}"></nav>

        <main class="col-md-9 col-lg-10 ms-sm-auto px-md-4 py-3">
            <div class="d-flex justify-content-between flex-wrap flex-md-nowrap align-items-center pb-2 mb-3 border-bottom">
                <h4 class="h5 text-primary fw-bold mb-0">Hồ Sơ &amp; Danh Sách Bệnh Nhân</h4>
            </div>

            <div class="card shadow-sm border-0">
                <div class="table-responsive">
                    <table class="table table-hover align-middle mb-0">
                        <thead class="table-light">
                            <tr>
                                <th>#</th>
                                <th>Mã Bệnh Nhân</th>
                                <th>Họ Và Tên</th>
                                <th>Giới Tính</th>
                                <th>Ngày Sinh</th>
                                <th>CCCD / CMND</th>
                                <th>Số BHYT</th>
                                <th>Số Điện Thoại</th>
                                <th>Địa Chỉ</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="p, stat : ${patients}">
                                <td th:text="${stat.count}">1</td>
                                <td><span class="badge bg-primary-subtle text-primary fw-bold" th:text="${p.patientCode}">PAT001</span></td>
                                <td><strong th:text="${p.fullName}">Nguyễn Văn A</strong></td>
                                <td th:text="${p.gender}">Nam</td>
                                <td th:text="${p.dateOfBirth != null ? #temporals.format(p.dateOfBirth, 'dd/MM/yyyy') : ''}">12/04/1965</td>
                                <td th:text="${p.identityCard}">001065012345</td>
                                <td><span class="badge bg-light text-dark border" th:text="${p.insuranceNumber}">BHYT-001</span></td>
                                <td th:text="${p.phone}">0934567890</td>
                                <td class="small text-muted" th:text="${p.address}">Hà Nội</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>
</div>

<div th:replace="~{layout/base :: scripts}"></div>
</body>
</html>
