<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head th:replace="~{layout/base :: head('Quản Lý Ca Khám Bệnh')}"></head>
<body>

<div class="container-fluid p-0">
    <div class="row g-0">
        <nav th:replace="~{layout/base :: sidebar}"></nav>

        <main class="col-md-9 col-lg-10 ms-sm-auto px-md-4 py-3">
            <div class="d-flex justify-content-between flex-wrap flex-md-nowrap align-items-center pb-2 mb-3 border-bottom">
                <h4 class="h5 text-primary fw-bold mb-0">Danh Sách Ca Khám Bệnh Lâm Sàng</h4>
            </div>

            <div class="card shadow-sm border-0">
                <div class="table-responsive">
                    <table class="table table-hover align-middle mb-0">
                        <thead class="table-light">
                            <tr>
                                <th>#</th>
                                <th>Mã Ca Khám</th>
                                <th>Bệnh Nhân</th>
                                <th>Bác Sĩ Phụ Trách</th>
                                <th>Ngày Khám</th>
                                <th>Chẩn Đoán Ban Đầu (ICD)</th>
                                <th>Triệu Chứng</th>
                                <th>Trạng Thái</th>
                                <th>Thao Tác</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="v, stat : ${visits}">
                                <td th:text="${stat.count}">1</td>
                                <td><span class="badge bg-light text-dark border font-monospace" th:text="${v.visitCode}">VIS001</span></td>
                                <td><strong th:text="${v.patient.fullName}">Nguyễn Văn A</strong></td>
                                <td th:text="${v.doctor.fullName}">BS. Tuấn</td>
                                <td class="small text-muted" th:text="${#temporals.format(v.visitDate, 'dd/MM/yyyy HH:mm')}">19/09/2026</td>
                                <td>
                                    <span class="badge bg-danger-subtle text-danger"
                                          th:text="${v.initialDiagnosis != null ? v.initialDiagnosis.icdCode + ' - ' + v.initialDiagnosis.diseaseName : 'Chưa có'}">
                                        I20.0
                                    </span>
                                </td>
                                <td class="small text-muted" th:text="${v.symptoms}">Đau ngực</td>
                                <td>
                                    <span th:if="${v.status == 'ACTIVE'}" class="badge bg-warning-subtle text-warning">Đang điều trị</span>
                                    <span th:if="${v.status == 'COMPLETED'}" class="badge bg-success-subtle text-success">Đã hoàn thành</span>
                                </td>
                                <td>
                                    <a th:href="@{/prescriptions/create(visitId=${v.id})}" class="btn btn-sm btn-primary">
                                        <i class="fas fa-prescription-bottle-alt me-1"></i> Kê Đơn Thuốc
                                    </a>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>
</div>

<div th:replace="~{layout/base :: scripts}"></div>
</body>
</html>
