<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head th:replace="~{layout/base :: head('Tập Phổ Biến (Frequent Itemsets)')}"></head>
<body>

<div class="container-fluid p-0">
    <div class="row g-0">
        <nav th:replace="~{layout/base :: sidebar}"></nav>

        <main class="col-md-9 col-lg-10 ms-sm-auto px-md-4 py-3">
            <div class="d-flex justify-content-between flex-wrap flex-md-nowrap align-items-center pb-2 mb-3 border-bottom">
                <h4 class="h5 text-primary fw-bold mb-0">Tập Thuốc Phổ Biến (Frequent Itemsets)</h4>
            </div>

            <!-- Bộ lọc lần chạy & kích thước itemset -->
            <div class="card shadow-sm border-0 mb-4">
                <div class="card-body">
                    <form th:action="@{/mining/itemsets}" method="get" class="row g-3 align-items-end">
                        <div class="col-md-5">
                            <label class="form-label small fw-semibold">Lần Chạy Khai Phá (Mining Run):</label>
                            <select name="runId" class="form-select" onchange="this.form.submit()">
                                <option th:each="r : ${runs}"
                                        th:value="${r.id}"
                                        th:text="${r.algorithm + ' - ' + r.runName + ' (' + r.frequentItemsetCount + ' itemsets)'}"
                                        th:selected="${r.id == selectedRunId}">Run 1</option>
                            </select>
                        </div>
                        <div class="col-md-4">
                            <label class="form-label small fw-semibold">Lọc Theo Số Lượng Thuốc (K-Itemset):</label>
                            <select name="itemCount" class="form-select" onchange="this.form.submit()">
                                <option value="" th:selected="${itemCountFilter == null}">Tất cả kích thước (1, 2, 3+)</option>
                                <option value="1" th:selected="${itemCountFilter == 1}">1-Itemset (Thuốc đơn lẻ)</option>
                                <option value="2" th:selected="${itemCountFilter == 2}">2-Itemset (Cặp 2 thuốc kết hợp)</option>
                                <option value="3" th:selected="${itemCountFilter == 3}">3-Itemset (Bộ 3 thuốc kết hợp)</option>
                                <option value="4" th:selected="${itemCountFilter == 4}">4-Itemset (Bộ 4 thuốc kết hợp)</option>
                            </select>
                        </div>
                        <div class="col-md-3">
                            <a th:href="@{/mining/itemsets}" class="btn btn-outline-secondary w-100">
                                <i class="fas fa-undo me-1"></i> Đặt Lại Bộ Lọc
                            </a>
                        </div>
                    </form>
                </div>
            </div>

            <!-- Bảng danh sách Frequent Itemsets -->
            <div class="card shadow-sm border-0">
                <div class="card-header bg-white py-3 d-flex justify-content-between align-items-center">
                    <h6 class="card-title mb-0 fw-bold text-secondary">
                        <i class="fas fa-layer-group text-primary me-2"></i> Danh Sách Tập Phổ Biến Đạt minSupport
                    </h6>
                    <span th:if="${currentRun != null}" class="badge bg-light text-dark border">
                        minSupport: <strong th:text="${#numbers.formatDecimal(currentRun.minSupport * 100, 1, 0) + '%'}">10%</strong>
                    </span>
                </div>
                <div class="table-responsive">
                    <table class="table table-hover align-middle mb-0">
                        <thead class="table-light">
                            <tr>
                                <th>#</th>
                                <th>Tập Thuốc Đồng Xuất Hiện (Frequent Itemset)</th>
                                <th>Kích Thước (k)</th>
                                <th>Số Giao Dịch Chứa</th>
                                <th>Độ Hỗ Trợ (Support)</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="fi, stat : ${itemsets}">
                                <td th:text="${stat.count}">1</td>
                                <td>
                                    <div class="d-flex flex-wrap gap-1">
                                        <span th:each="drug : ${#strings.arraySplit(fi.itemsetString, ',')}"
                                              class="badge bg-primary-subtle text-primary border"
                                              th:text="${drug.trim()}">Aspirin</span>
                                    </div>
                                </td>
                                <td>
                                    <span class="badge bg-secondary" th:text="${fi.itemCount + '-itemset'}">2-itemset</span>
                                </td>
                                <td>
                                    <strong th:text="${fi.supportCount}">6</strong> lần
                                </td>
                                <td>
                                    <div class="d-flex align-items-center gap-2">
                                        <div class="progress flex-grow-1" style="height: 16px;">
                                            <div class="progress-bar bg-success" role="progressbar"
                                                 th:style="'width: ' + (${fi.support} * 100.0) + '%;'">
                                            </div>
                                        </div>
                                        <span class="badge badge-support" th:text="${#numbers.formatDecimal(fi.support * 100, 1, 1) + '%'}">30.0%</span>
                                    </div>
                                </td>
                            </tr>
                            <tr th:if="${itemsets == null or itemsets.isEmpty()}">
                                <td colspan="5" class="text-center text-muted py-4">Không tìm thấy tập phổ biến nào phù hợp.</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>
</div>

<div th:replace="~{layout/base :: scripts}"></div>
</body>
</html>
