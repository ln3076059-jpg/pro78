<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head th:replace="~{layout/base :: head('Danh Sách Đơn Thuốc')}"></head>
<body>

<div class="container-fluid p-0">
    <div class="row g-0">
        <nav th:replace="~{layout/base :: sidebar}"></nav>

        <main class="col-md-9 col-lg-10 ms-sm-auto px-md-4 py-3">
            <div class="d-flex justify-content-between flex-wrap flex-md-nowrap align-items-center pb-2 mb-3 border-bottom">
                <h4 class="h5 text-primary fw-bold mb-0">Lịch Sử &amp; Danh Sách Đơn Thuốc Điều Trị</h4>
                <a th:href="@{/prescriptions/create}" class="btn btn-sm btn-primary">
                    <i class="fas fa-plus me-1"></i> Tạo đơn thuốc mới
                </a>
            </div>

            <div class="card shadow-sm border-0">
                <div class="table-responsive">
                    <table class="table table-hover align-middle mb-0">
                        <thead class="table-light">
                            <tr>
                                <th>#</th>
                                <th>Mã Đơn</th>
                                <th>Bệnh Nhân</th>
                                <th>Bác Sĩ Kê Đơn</th>
                                <th>Số Loại Thuốc</th>
                                <th>Trạng Thái</th>
                                <th>Ngày Kê Đơn</th>
                                <th>Thao Tác</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="p, stat : ${prescriptions}">
                                <td th:text="${stat.count}">1</td>
                                <td><strong th:text="${p.prescriptionCode}">RX001</strong></td>
                                <td>
                                    <span th:if="${p.visit != null and p.visit.patient != null}" th:text="${p.visit.patient.fullName}">Nguyễn Văn A</span>
                                </td>
                                <td>
                                    <span th:if="${p.doctor != null}" th:text="${p.doctor.fullName}">BS. Tuấn</span>
                                </td>
                                <td>
                                    <span class="badge bg-primary-subtle text-primary" th:text="${p.items != null ? p.items.size() : 0} + ' thuốc'">3 thuốc</span>
                                </td>
                                <td>
                                    <span class="badge bg-success-subtle text-success">Đã hoàn tất</span>
                                </td>
                                <td class="small text-muted" th:text="${#temporals.format(p.createdAt, 'dd/MM/yyyy HH:mm')}">19/09/2026</td>
                                <td>
                                    <a th:href="@{/prescriptions/{id}(id=${p.id})}" class="btn btn-sm btn-outline-info">
                                        <i class="fas fa-eye me-1"></i> Chi Tiết
                                    </a>
                                </td>
                            </tr>
                            <tr th:if="${prescriptions == null or prescriptions.isEmpty()}">
                                <td colspan="8" class="text-center text-muted py-4">Chưa có đơn thuốc nào được lưu.</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>
</div>

<div th:replace="~{layout/base :: scripts}"></div>
</body>
</html>
